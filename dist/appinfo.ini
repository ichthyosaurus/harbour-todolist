[app]

; REQUIRED ---------------------------------------------------------------------

name = To-do List
slug = harbour-todolist
summary = A simple to-do list manager with support for multiple projects
copyright_start = 2020
about_page = qml/pages/AboutPage.qml
forge = Codeberg
repo_url = codeberg.org/ichthyosaurus/${slug}
bugs_url = https://${repo_url}/issues/new
devel_status = stable
openrepos_id = 11049

hs_category = Office
or_category = Applications -> Application
tags = todo, todo list, List, tasks, manager, productivity, To-Do, simple

; OPTIONAL ---------------------------------------------------------------------

weblate_project = ${slug}
weblate_component = translations
have_patches = false

